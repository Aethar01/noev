name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Without the simulator
        run: |
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo test --workspace --no-default-features
      - name: Examples
        run: |
          for example in examples/*.nv; do
            cargo run --quiet --release -p noev -- run "$example" --seed 1 > /dev/null
          done

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-noev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tree-sitter
        run: npm install -g tree-sitter-cli@0.26.9
      - name: Generated parser is up to date
        run: |
          tree-sitter generate
          git diff --exit-code src/
      - name: Corpus
        run: tree-sitter test -p .
      - name: Every program in the repository parses
        run: |
          find ../../examples ../../tests -name '*.nv' > files
          tree-sitter parse -p . -q -s --paths files | tee result
          ! grep -E 'ERROR|MISSING' result
