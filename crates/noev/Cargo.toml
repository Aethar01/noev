[package]
name = "noev"
description = "The Noev compiler command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "noev"
path = "src/main.rs"

[dependencies]
noev-syntax = { path = "../noev-syntax" }
noev-sema = { path = "../noev-sema" }
noev-ir = { path = "../noev-ir" }
noev-runtime = { path = "../noev-runtime", default-features = false }
noev-codegen = { path = "../noev-codegen", default-features = false, optional = true }
clap = { version = "4.6.7", features = ["derive"] }
anstream = "1"
anstyle = "1"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
toml = "1.2.1"

[dev-dependencies]
serde_json = "1"

[features]
default = ["ketrs", "cranelift", "llvm"]
# The ketrs simulator as a backend for `noev run` and compiled binaries. Without it, only
# `--backend=export` runs.
ketrs = ["noev-runtime/ketrs"]
# The Cranelift native code generator (`noev build --codegen=cranelift`).
cranelift = ["dep:noev-codegen", "noev-codegen/cranelift"]
# The LLVM native code generator (`noev build --codegen=llvm`).
llvm = ["dep:noev-codegen", "noev-codegen/llvm"]

# The package integration suite runs `vqe` on the ketrs simulator.
[[test]]
name = "packages"
required-features = ["ketrs"]

# The run suite needs a simulator.
[[test]]
name = "run"
required-features = ["ketrs"]

# The compiled binary suite needs Cranelift and the ketrs simulator.
[[test]]
name = "codegen"
required-features = ["ketrs", "cranelift"]

# The LLVM compiled binary & QIR-linking suite needs LLVM and the ketrs simulator.
[[test]]
name = "llvm"
required-features = ["ketrs", "llvm"]

# The Rust embedding suite needs the ketrs simulator for quantum calls.
[[test]]
name = "embed"
required-features = ["ketrs"]

# The C/C++ interop suite needs Cranelift, LLVM, and the ketrs simulator.
[[test]]
name = "c_interop"
required-features = ["ketrs", "cranelift", "llvm"]

# The targets & plug-in backend suite needs ketrs and Cranelift.
[[test]]
name = "targets"
required-features = ["ketrs", "cranelift"]

# The `noev test` suite tests interpreter, Cranelift, and LLVM.
[[test]]
name = "testing"
required-features = ["ketrs", "cranelift", "llvm"]

[[bench]]
name = "embed"
harness = false
required-features = ["ketrs"]

[lints]
workspace = true
