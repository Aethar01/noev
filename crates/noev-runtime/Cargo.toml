[package]
name = "noev-runtime"
description = "Executes Noev programs, on ketrs or another quantum backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# From crates.io once published; until then the release tag.
ketrs = { git = "https://github.com/Aethar01/ketrs", tag = "v0.1.1" }
noev-ir = { path = "../noev-ir" }
noev-sema = { path = "../noev-sema" }
noev-syntax = { path = "../noev-syntax" }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[lints]
workspace = true
