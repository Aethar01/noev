[package]
name = "noev-runtime"
description = "Executes Noev programs, on ketrs or another quantum backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The ketrs simulator, one backend among possible others.
ketrs = { version = "0.1.1", optional = true }
noev-ir = { path = "../noev-ir" }
noev-sema = { path = "../noev-sema" }
noev-syntax = { path = "../noev-syntax" }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[features]
default = ["ketrs"]

# The end-to-end tests run programs on ketrs.
[[test]]
name = "run"
required-features = ["ketrs"]

[lints]
workspace = true
