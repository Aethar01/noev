[package]
name = "noev-codegen"
description = "Cranelift native code generator for the Noev quantum programming language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
noev-ir = { path = "../noev-ir" }
noev-runtime = { path = "../noev-runtime", default-features = false }
noev-sema = { path = "../noev-sema" }
cranelift-codegen = "0.138"
cranelift-frontend = "0.138"
cranelift-module = "0.138"
cranelift-native = "0.138"
cranelift-object = "0.138"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
noev-syntax = { path = "../noev-syntax" }

[[bench]]
name = "compile"
harness = false
